name: publish
on:
  push:
    tags:
      - "*.*.*"

jobs:
  publish:
    name: "Publish new version to TER and GitHub"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TYPO3_EXTENSION_KEY: ${{ secrets.TYPO3_EXTENSION_KEY }}
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v5
      - name: "Check tag"
        run: |
          if ! [[ "${GITHUB_REF_NAME}" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a valid version (x.y.z)"
            exit 1
          fi
          echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
      - name: "Get comment"
        run: |
          # actions/checkout does not keep annotated tag messages, fetch the tag object explicitly
          git fetch --force origin "refs/tags/${version}:refs/tags/${version}"
          comment=$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "${version}")

          if [[ -z "${comment// }" ]]; then
            comment="Released version ${version} of ${TYPO3_EXTENSION_KEY}"
          fi
          {
            echo 'comment<<EOF'
            echo "$comment"
            echo EOF
          } >> "$GITHUB_ENV"
      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, json, zip, curl
          tools: composer:v2
          coverage: none
      - name: "Install tailor"
        run: composer global require typo3/tailor:^1.7 --prefer-dist --no-progress
      - name: "Generate ext_emconf.php"
        run: php Build/Scripts/generateExtEmconf.php "${version}"
      - name: "Publish to TER"
        run: php "$(composer global config bin-dir --absolute --quiet)/tailor" ter:publish --comment "${comment}" "${version}"
      - name: "Create GitHub release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${version}" --title "${version}" --notes "${comment}" --verify-tag
