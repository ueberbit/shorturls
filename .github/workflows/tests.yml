name: tests
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  unit-tests:
    name: "Unit Tests (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v5
      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, json, curl, zip, pdo_sqlite, xml, fileinfo
          coverage: none
          tools: composer:v2
      - name: "Install dependencies"
        run: composer install --no-progress --no-interaction
      - name: "Run unit tests"
        run: .Build/bin/phpunit -c Build/phpunit/UnitTests.xml

  functional-tests:
    name: "Functional Tests (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v5
      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, json, curl, zip, pdo_sqlite, xml, fileinfo
          coverage: none
          tools: composer:v2
      - name: "Install dependencies"
        run: composer install --no-progress --no-interaction
      - name: "Run functional tests"
        run: .Build/bin/phpunit -c Build/phpunit/FunctionalTests.xml
